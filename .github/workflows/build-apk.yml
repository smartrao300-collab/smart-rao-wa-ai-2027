name: Build WhatsApp AI APK

on:
workflow_dispatch:
push:
paths:
- "whatsapp-ai-upload.zip"
- ".github/workflows/build-apk.yml"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Extract project
    run: |
      mkdir app-source
      unzip -o whatsapp-ai-upload.zip -d app-source
      rm -f app-source/gradle.properties
      touch app-source/gradle.properties

  - name: Build APK
    working-directory: app-source
    run: gradle --no-daemon assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: whatsapp-ai-debug-apk
      path: app-source/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
